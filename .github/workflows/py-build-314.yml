name: Build Python 3.14 Wheels

on:
  workflow_dispatch:

permissions: {}

jobs:
  build-linux:
    name: Build Linux x86_64 ${{ matrix.tag }} wheel
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "cpython-3.14"
            tag: "cp314"
          - python: "cpython-3.14t"
            tag: "cp314t"
    env:
      PYTHON_VERSION: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Python 3.14
        run: uv python install "$PYTHON_VERSION"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ zlib1g-dev libpng-dev

      - name: Build wheel
        run: |
          uv venv --python="$PYTHON_VERSION" .venv
          uv pip install --python .venv/bin/python build setuptools wheel cmake numpy
          .venv/bin/python -m build --wheel --outdir dist

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: aicspylibczi-linux-${{ matrix.tag }}-wheel
          path: dist/*.whl

  build-windows:
    name: Build Windows x64 ${{ matrix.tag }} wheel
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "cpython-3.14"
            tag: "cp314"
          - python: "cpython-3.14t"
            tag: "cp314t"
    env:
      PYTHON_VERSION: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Python 3.14
        run: uv python install "$env:PYTHON_VERSION"

      - name: Build wheel
        shell: pwsh
        run: |
          uv venv --python="$env:PYTHON_VERSION" .venv
          uv pip install --python .venv\Scripts\python.exe build setuptools wheel cmake numpy
          .venv\Scripts\python.exe -m build --wheel --outdir dist

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: aicspylibczi-windows-${{ matrix.tag }}-wheel
          path: dist/*.whl

  build-macos:
    name: Build macOS arm64 ${{ matrix.tag }} wheel
    runs-on: macos-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "cpython-3.14"
            tag: "cp314"
          - python: "cpython-3.14t"
            tag: "cp314t"
    env:
      PYTHON_VERSION: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Python 3.14
        run: uv python install "$PYTHON_VERSION"

      - name: Install build dependencies
        run: brew install cmake libpng

      - name: Build wheel
        run: |
          uv venv --python="$PYTHON_VERSION" .venv
          uv pip install --python .venv/bin/python build setuptools wheel cmake numpy
          .venv/bin/python -m build --wheel --outdir dist

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: aicspylibczi-macos-${{ matrix.tag }}-wheel
          path: dist/*.whl
